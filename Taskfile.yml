version: '3'

vars:
  APP_NAME: "Halmos Editor"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
      - task: bundle:licences

  bundle:licences:
    summary: Copies the licence texts into the packaged .app and signs it
    platforms: [darwin]
    vars:
      # Matched as a substring, like the release task's, so the default
      # finds "Developer ID Application: Name (TEAM)" without naming it.
      IDENTITY: '{{.IDENTITY | default "Developer ID Application"}}'
    desc: |
      A distributed binary has to carry its licences. Apache-2.0 §4(d) requires
      NOTICE to travel with the work, and citeproc-js is dual CPAL-1.0 /
      AGPL-3.0 — both require their licence to accompany the distribution.
      Having them in the repository satisfies source distribution and not
      binary distribution.

      This lives in the root Taskfile rather than build/darwin/Taskfile.yml
      because that file is regenerated by `wails3 task
      common:update:build-assets` and this one is not.

      Copied with .txt extensions so double-clicking one opens it rather than
      prompting for an application.
    cmds:
      - task: bundle:licences:copy
      # Nested code is signed before the bundle around it: the outer
      # signature records the extension's, and is signed without --deep.
      - task: quicklook:embed
        vars: { IDENTITY: '{{.IDENTITY}}' }
      # Signing must come last: codesign seals Contents/Resources, so files
      # added afterwards invalidate the signature.
      #
      # With the Developer ID when the keychain has one, ad-hoc otherwise.
      # macOS binds a privacy grant (Screen Recording, for demo mode) to the
      # app's designated requirement. A Developer ID requirement is the
      # bundle id plus the team, which every build shares, so a grant made
      # once lasts; an ad-hoc signature is a new identity every build, so
      # each repackage silently revoked it and the demo's record step failed.
      # Not the release path: that one does the same copy and extension
      # embed, then signs with `codesign --options runtime --timestamp` for
      # notarizing.
      - |
        if security find-identity -v -p codesigning | grep -q "{{.IDENTITY}}"; then
          codesign --force --sign "{{.IDENTITY}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app"
        else
          echo 'No "{{.IDENTITY}}" identity in the keychain; signing ad-hoc.'
          codesign --force --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"
        fi

  bundle:licences:copy:
    summary: Copies the licence texts in, without signing
    platforms: [darwin]
    internal: true
    vars:
      LICENCE_DIR: '{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/licences'
    cmds:
      - mkdir -p "{{.LICENCE_DIR}}"
      - cp LICENSE "{{.LICENCE_DIR}}/LICENSE.txt"
      - cp NOTICE "{{.LICENCE_DIR}}/NOTICE.txt"
      - cp licenses/citeproc-js.LICENSE "{{.LICENCE_DIR}}/citeproc-js.LICENSE.txt"
      - cp frontend/src/assets/csl/LICENSE.md "{{.LICENCE_DIR}}/csl-styles.LICENSE.md"

  release:
    summary: Builds a signed, notarized, stapled zip for distribution
    platforms: [darwin]
    desc: |
      The whole point of this task is the ORDER. Every step is placed relative
      to the signature, because codesign seals Contents/ and anything that
      touches the bundle afterwards invalidates it:

        test -> build universal -> bundle -> copy licences ->
        build, embed and sign the Quick Look extension -> sign the app ->
        notarize -> staple -> zip

      The extension (quicklook/, see quicklook:build) is nested code inside
      Contents/PlugIns, so it is signed before the app around it, with its own
      sandbox entitlements; the app is then signed without --deep. It is
      always rebuilt here, never reused from an earlier package.

      Why not `wails3 task darwin:sign:notarize`, which looks like it does
      this: its `deps: [package]` resolves inside build/darwin/Taskfile.yml to
      *that* file's package task, not the root one, so it notarizes a bundle
      with no licences in it — see bundle:licences for why they have to be
      there. And the root `package` re-signs at the end — plainly, without
      the hardened runtime or a timestamp, and ad-hoc on a machine with no
      Developer ID — so running it after this task replaces the notarized
      signature with one Gatekeeper rejects outright ("Hermes is damaged
      and can't be opened"). Neither is a fault in those tasks; they simply
      are not a release.

      Universal, not arm64-only: an Intel user downloading an arm64 build gets
      a baffling failure rather than a message.

      A zip, not a DMG: it notarizes identically and needs no layout work.
      Built with `ditto -c -k --keepParent` rather than `zip`, which does not
      preserve the symlinks and extended attributes a signed bundle depends
      on — a zip built the wrong way passes locally and fails after download.

      The zip is made TWICE, and that is not a mistake. Notarization takes an
      archive, not a bundle, so one is submitted; stapling then writes the
      ticket into the .app, which changes it, so the archive that ships has to
      be made again afterwards. Skip the second and you ship an unstapled app
      that fails to launch for anyone offline.

      First-time setup, once per machine:

        xcrun notarytool store-credentials "hermes-notary" \
          --apple-id <apple-id> --team-id <team-id> \
          --password <app-specific-password>

      Override the defaults with:
        wails3 task release IDENTITY="Developer ID Application: ..." NOTARY_PROFILE=other

      Or notarize with an App Store Connect API key instead of the keychain
      profile, which is how the Release workflow runs it:
        wails3 task release NOTARY_KEY=AuthKey.p8 NOTARY_KEY_ID=... NOTARY_ISSUER=...
    vars:
      IDENTITY: '{{.IDENTITY | default "Developer ID Application"}}'
      NOTARY_PROFILE: '{{.NOTARY_PROFILE | default "hermes-notary"}}'
      # Read from build/config.yml rather than duplicated here: that file is
      # what stamps CFBundleShortVersionString, which help.go reads back out
      # for the feedback form. Two copies would drift and the report would lie
      # about which build it came from.
      VERSION:
        sh: awk '/^  version:/ {gsub(/"/, "", $2); print $2}' build/config.yml
      APP: '{{.BIN_DIR}}/{{.APP_NAME}}.app'
      ZIP: '{{.BIN_DIR}}/Halmos-Editor-{{.VERSION}}-macos-universal.zip'
    preconditions:
      - sh: 'security find-identity -v -p codesigning | grep -q "{{.IDENTITY}}"'
        msg: |
          No "{{.IDENTITY}}" identity in the keychain.

          Note that "Apple Development" and "3rd Party Mac Developer
          Application" are NOT this: the first runs on your own machines, the
          second is for the Mac App Store. Distributing a download needs a
          Developer ID Application certificate, and its issuing intermediate
          ("Developer ID Certification Authority", G2) has to be installed
          too — without it the certificate is present but every identity reads
          CSSMERR_TP_NOT_TRUSTED and this check finds nothing.

          Xcode -> Settings -> Accounts -> Manage Certificates -> + does both.
      # The feed the app checks against must name the version being cut, or
      # the release ships and nobody is told. Bumped in the same commit as
      # config.yml; README's release steps push main only after the GitHub
      # release is published, so the feed never announces a version that
      # cannot be downloaded yet.
      - sh: 'grep -q "\"version\": \"{{.VERSION}}\"" updates/latest.json'
        msg: |
          updates/latest.json does not name {{.VERSION}}. Bump it alongside
          build/config.yml before cutting a release — see README, Cutting a
          release.
    cmds:
      # A release must not ship what the tests reject. CI gates main, but a
      # tag is cut from a working tree, and the working tree is what is about
      # to be built.
      - go test ./.
      - '{{.PACKAGE_MANAGER}} --prefix frontend test'
      - task: quicklook:test
      # create:app:bundle never cleans, so a Resources file deleted since the
      # last package would otherwise survive into the release.
      - rm -rf "{{.APP}}"
      # quicklook:build skips itself when its sources look unchanged; a
      # release must not trust that, so the extension is always rebuilt.
      - rm -rf "{{.BIN_DIR}}/HalmosQuickLook.appex"
      - task: darwin:package:universal
      - task: bundle:licences:copy
      # The Quick Look extension is nested code, so it is signed first — with
      # its own sandbox entitlements, which --deep would not apply.
      - task: quicklook:embed
        vars: { IDENTITY: '{{.IDENTITY}}', TIMESTAMP: '--timestamp' }
      # The extension needs network.client for WKWebView to start at all; the
      # docs' "fetches nothing" rests on the offline content rules instead.
      # Fail if it was signed with anything that would let it listen.
      # A case, not an if: Task's shell exits 1 from an if whose condition is
      # false and which has no else, which would fail every clean release.
      - |
        case "$(codesign -d --entitlements - "{{.APP}}/Contents/PlugIns/HalmosQuickLook.appex" 2>/dev/null)" in
          *network.server*)
            echo "HalmosQuickLook.appex is signed with com.apple.security.network.server; Quick Look must not accept connections."
            exit 1;;
        esac
      # --options runtime (hardened runtime) and --timestamp are both required
      # for notarization; without either, submission is rejected rather than
      # the app being. No --deep: Apple deprecated it for signing, and the
      # one piece of nested code, the Quick Look extension, is signed above.
      - codesign --force --options runtime --timestamp --sign "{{.IDENTITY}}" "{{.APP}}"
      - codesign --verify --strict --verbose=2 "{{.APP}}"
      - ditto -c -k --keepParent "{{.APP}}" "{{.ZIP}}"
      - task: release:notarize
        vars:
          ZIP: '{{.ZIP}}'
          NOTARY_PROFILE: '{{.NOTARY_PROFILE}}'
          NOTARY_KEY: '{{.NOTARY_KEY}}'
          NOTARY_KEY_ID: '{{.NOTARY_KEY_ID}}'
          NOTARY_ISSUER: '{{.NOTARY_ISSUER}}'
      # Staples the ticket into the bundle so it launches on a machine that
      # cannot reach Apple to ask.
      - xcrun stapler staple "{{.APP}}"
      - rm -f "{{.ZIP}}"
      - ditto -c -k --keepParent "{{.APP}}" "{{.ZIP}}"
      - task: release:verify
      - 'echo "Release artefact: {{.ZIP}}"'

  release:notarize:
    summary: Submits a release zip to Apple's notary service and waits for the answer
    platforms: [darwin]
    desc: |
      Called by release. With NOTARY_KEY set it authenticates with an App
      Store Connect API key (the .p8 file, its key ID and the issuer ID);
      otherwise with the keychain profile stored by `notarytool
      store-credentials`. The API key is what CI uses: it is not tied to a
      personal Apple ID and can be revoked on its own.
    vars:
      NOTARY_PROFILE: '{{.NOTARY_PROFILE | default "hermes-notary"}}'
      AUTH: >-
        {{if .NOTARY_KEY}}--key "{{.NOTARY_KEY}}" --key-id "{{.NOTARY_KEY_ID}}" --issuer "{{.NOTARY_ISSUER}}"{{else}}--keychain-profile "{{.NOTARY_PROFILE}}"{{end}}
    requires:
      vars: [ZIP]
    cmds:
      # --wait blocks until Apple has an answer, usually a few minutes. On
      # "Invalid", the reason is not printed here — fetch it with the same
      # credentials:
      #   xcrun notarytool log <submission-id> --keychain-profile {{.NOTARY_PROFILE}}
      #   xcrun notarytool log <submission-id> --key <p8> --key-id <id> --issuer <uuid>
      - xcrun notarytool submit "{{.ZIP}}" {{.AUTH}} --wait

  release:check-tag:
    summary: Fails unless TAG is v followed by the version in build/config.yml
    platforms: [darwin]
    desc: |
      The Release workflow runs this before anything is signed. The app
      derives its release page from the tag name, so a tag that disagrees
      with the bundle's version would send users to the wrong page.
    vars:
      VERSION:
        sh: awk '/^  version:/ {gsub(/"/, "", $2); print $2}' build/config.yml
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'test "{{.TAG}}" = "v{{.VERSION}}"'
        msg: 'Tag {{.TAG}} does not match build/config.yml version {{.VERSION}}; expected v{{.VERSION}}.'
    cmds:
      - 'echo "Tag {{.TAG}} matches version {{.VERSION}}."'

  release:notes:
    summary: Writes this version's CHANGELOG section to OUT, for the GitHub release
    platforms: [darwin]
    desc: |
      Takes everything under "## [<version>]" up to the next "## " heading,
      without the heading itself. Fails if the section is missing or empty,
      so a release is never created with blank notes.
    vars:
      VERSION:
        sh: awk '/^  version:/ {gsub(/"/, "", $2); print $2}' build/config.yml
      CHANGELOG: '{{.CHANGELOG | default "CHANGELOG.md"}}'
    requires:
      vars: [OUT]
    cmds:
      - |
        awk -v h="## [{{.VERSION}}]" 'index($0, h) == 1 {on=1; next} on && /^## / {exit} on' "{{.CHANGELOG}}" > "{{.OUT}}"
      - 'test -n "$(tr -d "[:space:]" < "{{.OUT}}")" || { echo "{{.CHANGELOG}} has no notes under ## [{{.VERSION}}]."; exit 1; }'
      - 'echo "Release notes for {{.VERSION}} written to {{.OUT}}."'

  release:verify:
    summary: Checks a built .app the way Gatekeeper will
    platforms: [darwin]
    desc: |
      Run against bin/<app>.app after `release`, or after unzipping a
      downloaded artefact to check what users actually get.

      spctl is the one that matters: codesign only proves the signature is
      intact, and an ad-hoc signature is intact too. "source=Notarized
      Developer ID" is the answer being looked for; "source=Unnotarized
      Developer ID" means the staple did not take.
    vars:
      APP: '{{.APP | default (printf "%s/%s.app" .BIN_DIR .APP_NAME)}}'
    cmds:
      - codesign --verify --deep --strict --verbose=2 "{{.APP}}"
      - codesign -dv --verbose=4 "{{.APP}}" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp|flags"
      - xcrun stapler validate "{{.APP}}"
      - spctl -a -vvv -t exec "{{.APP}}"
      # Proves the licences survived signing rather than being sealed out.
      - test -f "{{.APP}}/Contents/Resources/licences/NOTICE.txt"

  quicklook:build:
    summary: Builds the Quick Look preview extension into bin/HalmosQuickLook.appex
    platforms: [darwin]
    desc: |
      A view-based Quick Look extension (quicklook/) that previews .md files
      in Finder with the app's own renderer. Its page is frontend/quicklook.html,
      built separately by `vite build --mode quicklook` so the app's bundle is
      untouched, and carried in the extension's Resources/quicklook.

      Compiled with swiftc rather than an Xcode project: one source file, and
      the rest of the build is Task. Universal, like the release app. The
      entry point is NSExtensionMain, which is what makes the binary an
      extension rather than a program; -application-extension restricts it to
      extension-safe API.

      Not signed here — see quicklook:embed, which signs it in place inside
      the app.
    vars:
      APPEX: '{{.BIN_DIR}}/HalmosQuickLook.appex'
      VERSION:
        sh: /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/darwin/Info.plist
    sources:
      - quicklook/**/*
      - frontend/quicklook.html
      - frontend/src/**/*
      - frontend/public/style.css
      - frontend/vite.config.ts
      - frontend/package.json
      # A dependency update can change the page with no other file changing.
      - frontend/package-lock.json
      - build/darwin/Info.plist
    generates:
      - '{{.APPEX}}/Contents/MacOS/HalmosQuickLook'
    cmds:
      - '{{.PACKAGE_MANAGER}} --prefix frontend run build:quicklook'
      - rm -rf "{{.APPEX}}"
      - mkdir -p "{{.APPEX}}/Contents/MacOS" "{{.APPEX}}/Contents/Resources"
      - |
        for arch in arm64 x86_64; do
          xcrun swiftc -swift-version 5 -O -parse-as-library -application-extension \
            -target "$arch-apple-macos12.0" -module-name HalmosQuickLook \
            -framework Cocoa -framework Quartz -framework WebKit \
            -Xlinker -e -Xlinker _NSExtensionMain \
            quicklook/PreviewViewController.swift quicklook/PreviewText.swift \
            -o "{{.BIN_DIR}}/HalmosQuickLook-$arch"
        done
      - lipo -create -output "{{.APPEX}}/Contents/MacOS/HalmosQuickLook" "{{.BIN_DIR}}/HalmosQuickLook-arm64" "{{.BIN_DIR}}/HalmosQuickLook-x86_64"
      - rm -f "{{.BIN_DIR}}/HalmosQuickLook-arm64" "{{.BIN_DIR}}/HalmosQuickLook-x86_64"
      - cp quicklook/Info.plist "{{.APPEX}}/Contents/Info.plist"
      - /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString {{.VERSION}}" -c "Set :CFBundleVersion {{.VERSION}}" "{{.APPEX}}/Contents/Info.plist"
      - cp -R frontend/dist-quicklook "{{.APPEX}}/Contents/Resources/quicklook"

  quicklook:test:
    summary: Runs the Quick Look extension's Swift tests
    platforms: [darwin]
    desc: |
      quicklook/Tests/main.swift against quicklook/PreviewText.swift: reading
      and decoding the file (size cap, invalid UTF-8, byte-order mark) and
      deciding which navigations the page may make. A plain executable
      rather than XCTest, since there is no Xcode project. The page itself is tested by vitest
      (frontend/src/quicklook.test.ts).
    vars:
      TEST_BIN: '{{.BIN_DIR}}/HalmosQuickLookTests'
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - xcrun swiftc -swift-version 5 quicklook/PreviewText.swift quicklook/Tests/main.swift -o "{{.TEST_BIN}}"
      - defer: rm -f "{{.TEST_BIN}}"
      - '"{{.TEST_BIN}}"'

  quicklook:embed:
    summary: Copies the Quick Look extension into the packaged .app and signs it
    platforms: [darwin]
    internal: true
    desc: |
      Must run before the outer app is signed: the app's signature covers its
      nested code, so the extension is signed first and the app after it.
      Called by bundle:licences and release, which then sign the app.

      Its own entitlements (quicklook/HalmosQuickLook.entitlements): an app
      extension that is not sandboxed is refused by pluginkit. Hardened
      runtime always, so the package build is signed the way the release is.
    vars:
      IDENTITY: '{{.IDENTITY | default "Developer ID Application"}}'
      TIMESTAMP: '{{.TIMESTAMP | default ""}}'
      PLUGINS: '{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/PlugIns'
    cmds:
      - task: quicklook:build
      - rm -rf "{{.PLUGINS}}/HalmosQuickLook.appex"
      - mkdir -p "{{.PLUGINS}}"
      - ditto "{{.BIN_DIR}}/HalmosQuickLook.appex" "{{.PLUGINS}}/HalmosQuickLook.appex"
      - |
        if security find-identity -v -p codesigning | grep -q "{{.IDENTITY}}"; then
          signer="{{.IDENTITY}}"
        else
          signer=-
        fi
        codesign --force --options runtime {{.TIMESTAMP}} \
          --entitlements quicklook/HalmosQuickLook.entitlements \
          --sign "$signer" "{{.PLUGINS}}/HalmosQuickLook.appex"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
